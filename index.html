<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulso Semanal Smart Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400&display=swap">
<style>
/* Layout: banda amarilla de marca arriba con filtros; luego una sección por red (KPIs, dos históricos, análisis) y al final los contenidos destacados. Un solo look de marca sobre fondo blanco. */
:root{
  --brand:#FFB612; --ink:#000000; --paper:#FFFFFF;
  --bg:#FFFFFF; --surface:#F6F5F2; --line:#E4E1DA;
  --fg:#000000; --muted:#5E5B55; --dim:#FFE2A0;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-weight:400;font-size:15px;line-height:1.5;margin:0}
h1,h2,h3,h4,strong,b,th{font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--brand);color:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand-line{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-size:14px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--brand)}
.tab:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main a:focus-visible,main summary:focus-visible{outline-color:var(--ink)}
label.sel{display:flex;align-items:center;gap:8px;font-size:14px}
select{font:inherit;font-size:14px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:7px 10px}
main .wrap{padding-block:28px 48px;display:flex;flex-direction:column;gap:44px}
.net-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:18px}
h2{font-size:26px;margin:0;color:var(--fg)}
.net-head .sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d.up{color:var(--fg)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.chart{background:var(--surface);border-radius:10px;padding:14px 14px 8px;position:relative;min-width:0}
.chart h3{font-size:14px;margin:0 0 6px;color:var(--fg)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .val{fill:var(--fg);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--dim)}
.chart .bar.on{fill:var(--brand)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.analysis{margin-top:16px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}
.analysis .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.analysis p{margin:0;max-width:72ch;white-space:pre-line}
.analysis .empty{color:var(--muted)}
details{margin-top:12px;grid-column:2}
summary{cursor:pointer;color:var(--fg);font-size:14px;text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.hist li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:14px}
.hist .w{color:var(--muted);font-variant-numeric:tabular-nums}
.hist p{margin:0;max-width:72ch;white-space:pre-line}
.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.post{background:var(--surface);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.post .tag{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.post.best .tag{background:var(--brand);color:var(--ink)}
.post.worst .tag{background:var(--ink);color:var(--paper)}
.post .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.post h3{font-size:20px;margin:0;line-height:1.25;text-wrap:balance}
.post p{margin:0;white-space:pre-line;font-size:14px}
.frame{display:flex;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frame iframe{border:0;width:100%;max-width:420px;height:560px;display:block;background:var(--paper)}
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:1px dashed var(--brand);border-radius:8px;color:var(--fg);text-decoration:none}
.linkcard .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.linkcard .t span:last-child{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;white-space:nowrap}
.none{color:var(--muted);background:var(--surface);border-radius:10px;padding:16px}
.notes{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.notes ul{margin:6px 0 0;padding-left:18px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.charts,.content-grid{grid-template-columns:minmax(0,1fr)}.analysis{grid-template-columns:minmax(0,1fr);gap:6px}details{grid-column:1}}
@media (max-width:720px){header.top{position:static}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:1/-1}.kpi .v{font-size:22px}.hist li{grid-template-columns:minmax(0,1fr);gap:2px}}
@media (prefers-reduced-motion:no-preference){.chart .bar{transition:fill .15s}}
</style>

</head>
<body>

  <div class="wrap">

      <span class="eyebrow">Smart Fit Group · Comité de mercadeo</span>

</header>

<main><div class="wrap" id="app"></div></main>

s interacciones en un 1.68% (siendo los me gusta la principal interacción), los carruseles logramos un alcance superior a mil usuarios con un pico de 4.9000 usarios alcanzados. Se recomienda continuar con este formato como el más frecuente en la red e invitar a los usuarios a enviar, compartir o comentar dentro del contenido.", "Presentamos una disminución en el alcance (del 0.54%) pero aumentamos la tasa de ER (con un 0.26% más) lo que muestra que aunque llegamos a menos personas logramos activar más a dichos seguidores presentando además 2 contenidos menos en comparación a la semana anterior.", "Logramos tener una semana positiva respecto al crecimiento de seguidores, sumando 84 perfiles nuevos. Aunque tuvimos 3 publicaciones menos nuestro alcance aumentó un 0.12% al igual que las interacciones con un 0.36%.   Los contenidos de \"Y tú por qué entrenas?\" y \"Grandes motivos para seguir\" generaron una actividad positiva y poco usual en este canal, lo que nos dirige a ampliar las propuestas participativas y emocionales.", "Por segunda semana consecutiva seguimos fortaleciendo el crecimiento de la cuenta (+90 seguidores), tuvimos 2 contenidos adicionales que ampliaron nuestro alcance pero no lograron superar las interacciones de la semana pasada, el contenido más eficaz de la red fue el carrusel de Halterofilia."], "notas": []}, "instagram": {"seguidores": [635286.0, 636537.0, 636968.0, 637350.0, 638023.0, 638796.0, 639580.0, 640309.0, 641137.0], "publicaciones": [3.0, 5.0, 10.0, 10.0, 16.0, 13.0, 11.0, 11.0, 9.0], "alcance": [104411.0, 339810.0, 272241.0, 160238.0, 182267.0, 595284.0, 224113.0, 262395.0, 206259.0], "interacciones": [3194.0, 8440.0, 7579.0, 4862.0, 4721.0, 7480.0, 6253.0, 4623.0, 5994.0], "er": [3.059064658, 2.483740914, 2.783930415, 3.034236573, 2.590156199, 1.256543095, 2.790110346, 1.761847596, 2.906055009], "analisis": [null, "La red presenta un crecimiento positivo en sus interacciones generales apalancado por el alcande a nuevo público. La única interacción que disminuyo fueron los \"enviados\" pero se mantuvieron en un porcentaje positivo.", "Presentamos un descenso en el alcance del 19% y de las interacciones un 10.2% debido a que las colaboraciones de la semana pasado fueron con influenciadores de mayor alcance peor igualmente mantuvimos el crecimiento de seguidores y elevamos el engagement un 0.30% indicando mayor fidelidad de nuestras audiencias con los contenidos.", "Aunque presentamos un descenso en el alcance y las interacciones, considerando que tuvimos contenidos de gran alcance la semana pasada (Fit Friend, Farmeando aura) logramos aumentar nuestro engagement demostrando fidelidad y actividad de la audiencia alcanzada, es importante aplicar tendencias, colaboraciones y contenido de valor de forma constante para mantener una tasa de alcance superior.", "Por medio de 3 contenidos tácticos (Rutina de glúteos, testimonio 2 y mitos y verdades) logramos aumentar nuestro alcance (13.75%) aunque no logramos superar el umbral de interacciones de la semana pasada por una pequeña diferencia (-2.90%). Mantuvimos la interacción centrada en comentarios y repost.", "Continuamos presentando un crecimiento constante y sostenido en la cuenta, aunque tuvimos 3 publicaciones menos que la semana anterior logramos un alcance 226% superior y aumentamos nuestras interaciones en un 58% evidenciando que la aplicación de tendencias fue óptimas, sobre todo enfocadas en temas culturales en Smart Fit.", "Llevamos 2 semanas consecutivas obteniendo más de 700 seguidores netos lo que demuestra un alcance eficaz a nuevos públicos interesados en el fitness. Tuvimos 2 públicaciones menos lo que pudo disminuir nuestro alcance (-62%) e igualmentepresentamos una menor frecuencia en contenidos de formatos en tendencia, uno de ellos de tendencia no fue tan óptimo a como lo anticipamos, pero otro fue un rotundo éxito y apalanco un gran porcentaje de actividad en la cuenta.", "Hemos mantenido en crecimiento sostenido por semana encima r alcance e interacciones.", "Logramos aumentar nuestro público un 1.25% siendo un record este mes, e igualmente aumentando nuestro alcance e interacciones potenciado principalmente por el contenido de Rutina de glúteos realizada con una PT logrando +60 compartidos y +190 enviados.", "Aunque nuestro alcance fue similar al de la semana anterior (-17%) las interacciones disminuyeron (66%) disminuyendo nuestro ER general, igualmente la actividad fue positiva comparando las interacciones con semanas anteriores, el contenido más positivo fue el de la sede Los Patios, se recomienda retomar rutinas y contenidos que respondan a preguntas frecuentes de los seguidores.", "Logramos impulsar el aumento de todas las cifras (a excepción de los comentarios) a través de un 5.35% más de alcance y un 68.7% más de interacciones logrando posicionar el ER en un 3.8% por medio de los contenidos de \"Consejos de nuestra fisio\" y \"¿Por qué se dañarán las máquinas?\"", "En general tanto el alcance (-48%) cómo las interacciones (-61%) disminuyeron pero se mantuvo una participación positiva y constante en los contenidos. Venimos de una semana con un video de gran interacción (Cosas que No debes hacer en Smart Fit) que logro + de 50 mil visualizaciones y 800 interacciones por lo que los resultados de esta semana son normales dentro de la actividad usual del canal.", "Logramos un actividad positiva y mayor tanto en alcance (+12%) como en interacciones 823%) logrando posicionar el ER en 3.19%. Esto debido en parte a la mayor frecuencia de posteos (+4) y a los contenidos que conectaron y captaron mejor la atención de la audiencia entre ellos: Sky Experience Medellín, Smart Fit Energy y Sky Experience Bogotá."], "notas": []}}, "contenido": [null, {"eficaz": null, "regular": null}, {"eficaz": {"link": "https://www.instagram.com/reel/DcuDvOOiuOd/embed", "tema": "Fit Friend", "analisis": "El reel apalanco su alcance orgnánico a través de conversaciones internas (946 enviados y 329 guardados), es fu const EMBED = location.protocol === 'file:';
const NET = {facebook:'Facebook', instagram:'Instagram', tiktok:'TikTok'};
const nf = new Intl.NumberFormat('es-CO');
const pf = new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = v => v==null ? '—' : nf.format(Math.round(v));
const fmtER = v => v==null ? '—' : pf.format(v)+' %';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {c:0, w:DATA.weeks.length-1};

function delta(cur, prev, isER){
  if(cur==null||prev==null) return '<span class="d">Sin dato de la semana anterior</span>';
  if(isER){ const d=cur-prev; return `<span class="d ${d>0?'up':''}">${d>0?'▲':d<0?'▼':'='} ${pf.format(Math.abs(d))} pp vs semana anterior</span>`; }
  const d=cur-prev;
  if(prev===0) return `<span class="d ${d>0?'up':''}">${d>0?'▲ +'+nf.format(d):'= 0'} vs semana anterior</span>`;
  const p=d/prev*100;
  return `<span class="d ${d>0?'up':''}">${d>0?'▲ +':d<0?'▼ −':'= '}${pf.format(Math.abs(p))} % vs semana anterior</span>`;
}

function chart(title, series, w){
  const W=600,H=210,L=8,R=8,T=22,B=34, n=series.length;
  const max=Math.max(1,...series.filter(v=>v!=null));
  const step=(W-L-R)/n, bw=Math.min(40,step*.56);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  [0,.5,1].forEach(f=>{const yy=T+(H-T-B)*(1-f); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/>`;});
  series.forEach((v,i)=>{
    const cx=L+step*i+step/2;
    if(v!=null){
      const h=Math.max(v>0?2:0,(H-T-B)-(y(v)-T)), top=H-B-h, r=Math.min(4,bw/2,h);
      g+=`<path class="bar ${i===w?'on':''}" d="M${cx-bw/2},${H-B} V${top+r} Q${cx-bw/2},${top} ${cx-bw/2+r},${top} H${cx+bw/2-r} Q${cx+bw/2},${top} ${cx+bw/2},${top+r} V${H-B} Z"/>`;
      if(i===w) g+=`<text class="val" x="${cx}" y="${top-6}" text-anchor="middle">${fmt(v)}</text>`;
    }
    const lab=DATA.weeks[i].split('–');
    g+=`<text class="ax" x="${cx}" y="${H-B+14}" text-anchor="middle">${esc(lab[0])}–</text><text class="ax" x="${cx}" y="${H-B+26}" text-anchor="middle">${esc(lab[1])}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${L+step*i}" y="${T-16}" width="${step}" height="${H-T-B+16}"/>`;
  });
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} por semana">${g}</svg><div class="tip" hidden></div></div>`;
}

function analysisBlock(net){
  const a=net.analisis[state.w];
  const items=net.analisis.map((t,i)=>t?`<li><span class="w">${esc(DATA.weeks[i])}</span><p>${esc(t)}</p></li>`:'').filter(Boolean).reverse().join('');
  return `<div class="analysis"><span class="lbl">Análisis del equipo</span>${a?`<p>${esc(a)}</p>`:`<p class="empty">La hoja no tiene análisis escrito para esta semana.</p>`}
  <details><summary>Ver análisis de todas las semanas</summary><ul class="hist">${items}</ul></details></div>`;
}

function netSection(key, net){
  const w=state.w, p=w-1;
  const k=(lbl,arr,isER,f)=>`<div class="kpi"><span class="k">${lbl}</span><span class="v">${(f||fmt)(arr[w])}</span>${p>=0?delta(arr[w],arr[p],isER):'<span class="d">Primera semana del registro</span>'}</div>`;
  return `<section aria-labelledby="h-${key}">
    <div class="net-head"><h2 id="h-${key}">${NET[key]}</h2><span class="sub">${esc(DATA.weeks[w])} · ${esc(DATA.countries[state.c].name)}</span></div>
    <div class="kpis">${k('Alcance',net.alcance)}${k('Interacciones',net.interacciones)}${k('Engagement rate',net.er,true,fmtER)}${k('Seguidores',net.seguidores)}${k('Publicaciones',net.publicaciones)}</div>
    <div class="charts">${chart('Histórico de alcance',net.alcance,w)}${chart('Histórico de interacciones',net.interacciones,w)}</div>
    ${analysisBlock(net)}
  </section>`;
}

function igParts(link){
  const m=String(link).match(/instagram\.com\/(p|reels?|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return {open:link, embed:null};
  const kind=m[1].startsWith('reel')?'reel':m[1];
  return {open:`https://www.instagram.com/${kind}/${m[2]}/`, embed:`https://www.instagram.com/${kind}/${m[2]}/embed/`};
}

      : `<a class="linkcard" href="${esc(ig.open)}" target="_blank" rel="noopener"><span class="t"><span>Ver la publicación en Instagram</span><span>${esc(ig.open.replace('https://www.',''))}</span></span><span class="btn">Abrir ↗</span></a>`;
  } else media = `<p class="empty">La hoja no trae enlace para este contenido.</p>`;
  return `<article class="post ${cls}"><div class="tag"><span>${label}</span></div><div class="body">
    <h3>${esc(item.tema||'Sin temática')}</h3>${media}
    ${item.analisis?`<p>${esc(item.analisis)}</p>`:''}</div></article>`;
}

function render(){
  const c=DATA.countries[state.c];
  document.querySelectorAll('.tab').forEach((b,i)=>b.setAttribute('aria-pressed',i===state.c));
  document.getElementById('week').value=state.w;
  let html='';
  for(const key of ['facebook','instagram','tiktok']){ if(c.networks[key]) html+=netSection(key,c.networks[key]); }
  const ct=c.contenido[state.w];
  html+=`<section aria-labelledby="h-cont"><div class="net-head"><h2 id="h-cont">Contenidos destacados</h2><span class="sub">${esc(DATA.weeks[state.w])} · ${esc(c.name)}</span></div>
    ${ct?`<div class="content-grid">${postCard(ct.eficaz,'best','Más eficaz')}${postCard(ct.regular,'worst','Menos eficaz')}</div>`:`<p class="none">La hoja no registra contenidos destacados para esta semana.</p>`}</section>`;
  const notes=[...Object.entries(c.networks).flatMap(([k,n])=>n.notas.map(t=>NET[k]+' · '+t)), ...(DATA.notes[c.code]||[])];
  html+=`<div class="notes">Fuente: Google Sheets «OFICIAL SEMANAL DASHBOARD SMART». Los análisis y las temáticas se muestran tal como están escritos en la hoja. Las variaciones frente a la semana anterior se calculan sobre las cifras de la hoja.${notes.length?'<ul>'+notes.map(n=>`<li>${esc(n)}</li>`).join('')+'</ul>':''}${EMBED?'':'<p>Instagram no permite incrustar sus publicaciones en esta página publicada; ábrelas con el botón de cada tarjeta. En la copia local del dashboard se ven incrustadas.</p>'}</div>`;
  document.getElementById('app').innerHTML=html;
  wireCharts();
}

function wireCharts(){
  document.querySelectorAll('.chart').forEach(ch=>{
    const tip=ch.querySelector('.tip'), svg=ch.querySelector('svg');
    const sec=ch.closest('section'), key=sec.id||'';
    ch.querySelectorAll('.hit').forEach(r=>{
      const i=+r.dataset.i;
      const show=()=>{
        const netKey=sec.querySelector('h2').id.slice(2), n=DATA.countries[state.c].networks[netKey];
        const arr=ch.querySelector('h3').textContent.includes('alcance')?n.alcance:n.interacciones;
        const bb=r.getBoundingClientRect(), cb=ch.getBoundingClientRect();
        tip.textContent=`${DATA.weeks[i]}: ${fmt(arr[i])}`;
        tip.style.left=(bb.left-cb.left+bb.width/2)+'px'; tip.style.top=(bb.top-cb.top+18)+'px'; tip.hidden=false;
      };
      r.addEventListener('mouseenter',show); r.addEventListener('mouseleave',()=>tip.hidden=true);
      r.addEventListener('click',()=>{state.w=i; render();});
    });
  });
}

const tabs=document.getElementById('tabs');
DATA.countries.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.id='tab-'+c.code;b.textContent=c.name;b.onclick=()=>{state.c=i;try{localStorage.setItem('pulso-state',JSON.stringify({c:i}))}catch(e){};render();};tabs.appendChild(b);});
const sel=document.getElementById('week');
DATA.weeks.forEach((w,i)=>{const o=document.createElement('option');o.value=i;o.textContent=w;sel.appendChild(o);});
sel.onchange=()=>{state.w=+sel.value;render();};
render();
</script>

</body>
</html>
